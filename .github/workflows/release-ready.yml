name: release-ready

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-ready:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse fork branches
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "release pull requests come from release/vX.Y.Z branches in $GITHUB_REPOSITORY" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git fetch -q --tags origin +refs/heads/main:refs/remotes/origin/main
          python3 scripts/test-release.py
          python3 scripts/guest-release.py gate --branch "$BRANCH" --main-ref origin/main
