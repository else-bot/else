name: release-ready

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Mark readiness pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=release-ready \
            -f description="Verifying the release and pinned guest image" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git fetch -q --tags origin +refs/heads/main:refs/remotes/origin/main
          python3 scripts/test-release.py
          python3 scripts/guest-release.py gate --branch "$BRANCH" --main-ref origin/main
      - name: Report readiness
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          case "$RESULT" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=release-ready \
            -f description="Release verification: $RESULT" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
