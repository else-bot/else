name: release-ready

# Checks the release tooling and installers. Pull requests must also keep
# the workspace version, which only the release workflow changes.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to check
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-ready-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  release-ready:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test release packaging and publication
        run: python3 scripts/test-release.py
      - name: Test installation removal
        run: python3 scripts/test-remove.py
      - name: Test prebuilt installer
        run: python3 scripts/test-install-downloads.py
      - name: Check shell syntax
        run: |
          bash -n install.sh scripts/elsebot scripts/release.sh scripts/build-guest-image.sh scripts/build-guest-base.sh \
            scripts/test-install.sh scripts/e2e/install-scenario.sh
      - name: Keep the workspace version
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q origin +refs/heads/main:refs/remotes/origin/main
          python3 scripts/guest_release.py gate --main-ref origin/main
