name: release-checks

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  release-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          bash -n install.sh scripts/release.sh scripts/build-guest-image.sh
          python3 scripts/test-release.py
          python3 scripts/test-install-config.py
          python3 scripts/e2e/test_installer_guest_image.py
          python3 scripts/e2e/test_isolation.py
