name: cargo-test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to test
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: cargo-test-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-check:
    if: inputs.ref == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check migration numbering
        run: python3 scripts/check_migrations.py
      - name: Test migration numbering check
        run: python3 scripts/test-migrations.py
      - name: Install build dependencies
        timeout-minutes: 10
        # Fail a stalled mirror fast and retry instead of hanging until the job limit.
        env:
          APT_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120
        run: |
          sudo apt-get $APT_OPTIONS update
          sudo apt-get $APT_OPTIONS install -y --no-install-recommends \
            build-essential pkg-config sqlite3 libssl-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libx11-xcb-dev libx11-dev libfontconfig-dev libfreetype-dev libvulkan1 libzstd-dev
      - name: Install stable Rust
        id: rust
        run: |
          rustup set profile minimal
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Restore Cargo build cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ steps.rust.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-${{ steps.rust.outputs.version }}-
      - name: Check workspace and test targets
        run: cargo check --workspace --all-targets --locked
      - name: Check strict Clippy
        run: scripts/check-clippy.sh
      - name: Build bundled-icon tests
        run: cargo test -p else-desktop --bin else-desktop --locked icon_assets_tests --no-run
      - name: Save Cargo build cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Check bundled-icon coverage
        run: cargo test -p else-desktop --bin else-desktop --locked icon_assets_tests
  cargo-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install build dependencies
        timeout-minutes: 10
        # Fail a stalled mirror fast and retry instead of hanging until the job limit.
        env:
          APT_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120
        run: |
          sudo apt-get $APT_OPTIONS update
          sudo apt-get $APT_OPTIONS install -y --no-install-recommends \
            build-essential pkg-config sqlite3 libssl-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libx11-xcb-dev libx11-dev libfontconfig-dev libfreetype-dev libvulkan1 libzstd-dev
      - name: Install stable Rust
        id: rust
        run: |
          rustup set profile minimal
          rustup update stable --no-self-update
          rustup default stable
          echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Restore Cargo build cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.rust.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.rust.outputs.version }}-
      - name: Build workspace tests
        run: cargo test --workspace --locked --jobs 2 --no-run
      - name: Save Cargo build cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Run workspace tests
        run: cargo test --workspace --locked --jobs 2
