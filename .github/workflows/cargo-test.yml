name: cargo-test

on:
  pull_request:
    branches: [main]
    # Rust does not compile these paths in; the pre-commit hook skips them too.
    paths-ignore: ['docs/**', '.agents/**', '.claude/**', '*.md']
  # Caches are saved only on main, where every pull request can restore them.
  push:
    branches: [main]
    # Rust does not compile these paths in; the pre-commit hook skips them too.
    paths-ignore: ['docs/**', '.agents/**', '.claude/**', '*.md']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to test
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: cargo-test-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts never get reused on a fresh runner and slow down a from-scratch build.
  CARGO_INCREMENTAL: 0

jobs:
  cargo-check:
    if: inputs.ref == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check migration numbering
        run: python3 scripts/check_migrations.py
      - name: Test migration numbering check
        run: python3 scripts/test-migrations.py
      - name: Test dev test scheduler
        run: python3 -m unittest discover -s scripts -p test_dev_tests.py
      - name: Install build dependencies
        timeout-minutes: 10
        # Fail a stalled mirror fast and retry instead of hanging until the job limit.
        env:
          APT_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120
        run: |
          sudo apt-get $APT_OPTIONS update
          sudo apt-get $APT_OPTIONS install -y --no-install-recommends \
            build-essential pkg-config sqlite3 libssl-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libx11-xcb-dev libx11-dev libfontconfig-dev libfreetype-dev libvulkan1 libzstd-dev
      - name: Install stable Rust
        run: |
          rustup set profile minimal
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Clippy type-checks every target, so a separate cargo check is redundant.
      - name: Check strict Clippy
        run: scripts/check-clippy.sh
  cargo-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install build dependencies
        timeout-minutes: 10
        # Fail a stalled mirror fast and retry instead of hanging until the job limit.
        env:
          APT_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120
        run: |
          sudo apt-get $APT_OPTIONS update
          sudo apt-get $APT_OPTIONS install -y --no-install-recommends \
            build-essential pkg-config sqlite3 libssl-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libx11-xcb-dev libx11-dev libfontconfig-dev libfreetype-dev libvulkan1 libzstd-dev
      - name: Install stable Rust
        run: |
          rustup set profile minimal
          rustup update stable --no-self-update
          rustup default stable
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build workspace tests
        run: cargo nextest run --workspace --locked --no-run
      # Nextest runs tests from every binary in parallel; cargo test runs binaries one by one.
      - name: Run workspace tests
        run: cargo nextest run --workspace --locked --no-fail-fast
      - name: Run doc tests
        run: cargo test --workspace --locked --doc
