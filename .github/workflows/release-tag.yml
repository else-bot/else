name: release-tag

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-tag
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_RELEASE_STRIP: debuginfo

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      state: ${{ steps.plan.outputs.state }}
    steps:
      - uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py plan --remote origin --main main >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.state == 'build'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: blacksmith-4vcpu-ubuntu-2404
            container: debian:12
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
            container: debian:12
            target: aarch64-unknown-linux-gnu
          - platform: macos-arm64
            runner: blacksmith-6vcpu-macos-15
            container: ''
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config git curl ca-certificates python3 libssl-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libx11-xcb-dev libx11-dev libfontconfig-dev libfreetype-dev libvulkan1 libzstd-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the Metal compiler
        if: runner.os == 'macOS'
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version
      - name: Install stable Rust
        id: rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add '${{ matrix.target }}'
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Restore Cargo build cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/${{ matrix.target }}
          key: release-${{ matrix.platform }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.platform }}-${{ steps.rust.outputs.version }}-
      - name: Prepare email sign-in configuration
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import uuid
          from pathlib import Path

          value = os.environ.get("GOOGLE_OAUTH_CLIENT_JSON", "")
          if not value.strip():
              raise SystemExit("Set the GOOGLE_OAUTH_CLIENT_JSON repository secret before building a release.")
          microsoft = os.environ.get("MICROSOFT_CLIENT_ID", "")
          if not microsoft:
              raise SystemExit("Set the MICROSOFT_CLIENT_ID repository secret before building a release.")
          try:
              microsoft = str(uuid.UUID(microsoft))
          except ValueError:
              raise SystemExit("MICROSOFT_CLIENT_ID must be an application ID UUID.")
          path = Path(os.environ["RUNNER_TEMP"]) / "else-google-desktop.json"
          with open(path, "w", opener=lambda name, flags: os.open(name, flags, 0o600)) as config:
              config.write(value)
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"ELSE_GOOGLE_OAUTH_CONFIG={path}\n")
              environment.write(f"ELSE_MICROSOFT_CLIENT_ID={microsoft}\n")
          PY
      - name: Prepare GitHub MCP sign-in configuration
        env:
          ELSE_GITHUB_CLIENT_ID: ${{ secrets.ELSE_GITHUB_CLIENT_ID }}
          ELSE_GITHUB_CLIENT_SECRET: ${{ secrets.ELSE_GITHUB_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          registration = {}
          for field, name in (("client_id", "ELSE_GITHUB_CLIENT_ID"), ("client_secret", "ELSE_GITHUB_CLIENT_SECRET")):
              value = os.environ.get(name, "")
              if not value or len(value) > 2048 or any(not 0x21 <= ord(char) <= 0x7e for char in value):
                  raise SystemExit(f"Set a valid {name} repository secret before building a release.")
              registration[field] = value
          path = Path(os.environ["RUNNER_TEMP"]) / "else-github-oauth.json"
          with open(path, "w", opener=lambda name, flags: os.open(name, flags, 0o600)) as config:
              json.dump(registration, config)
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"ELSE_GITHUB_OAUTH_CONFIG={path}\n")
          PY
      - name: Build the desktop and API
        run: cargo build --release --locked --workspace --bins --target '${{ matrix.target }}'
      - name: Remove OAuth registrations
        if: always()
        run: rm -f "$RUNNER_TEMP/else-google-desktop.json" "$RUNNER_TEMP/else-github-oauth.json"
      - name: Save Cargo build cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/${{ matrix.target }}
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Check binary versions
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          for binary in else-api else-desktop; do
            actual="$("target/${{ matrix.target }}/release/$binary" --version)"
            test "$actual" = "$binary $version"
          done
      - name: Package binaries
        run: python3 scripts/release_binaries.py --platform '${{ matrix.platform }}' --binaries 'target/${{ matrix.target }}/release'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: target/release-assets/*.tar.gz
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 7

  finalize:
    needs: [plan, build]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: target/release-assets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/release.py finalize --remote origin --main main --assets-dir target/release-assets
