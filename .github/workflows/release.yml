name: release

# Releases a commit on main without a pull request. The plan picks the next
# version from the newest release tag, the guest image is reused or built
# for that commit, and `prepare` pushes one release commit on top of it to
# release/vX.Y.Z that bumps the version and pins the image. Tests and native
# builds run on that commit, then `publish` tags it and publishes the binaries.
# Main is never changed, so pull requests can keep merging meanwhile.
# Jobs run this revision's release helpers (.release-tools) against the
# selected commit, so older commits and tags need no matching helpers.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch
      sha:
        description: Commit on main to release; defaults to the head of main
        type: string
        default: ''
      request:
        description: Identifier that scripts/release.sh uses to find this run
        type: string
        default: ''

run-name: release ${{ inputs.bump }}${{ inputs.request != '' && format(' [{0}]', inputs.request) || '' }}

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_RELEASE_STRIP: debuginfo
  IMAGE_REPO: ghcr.io/else-bot/else-guest

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      state: ${{ steps.plan.outputs.state }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      candidate: ${{ steps.plan.outputs.candidate }}
      guest_state: ${{ steps.plan.outputs.guest_state }}
      guest_hash: ${{ steps.plan.outputs.guest_hash }}
      guest_image: ${{ steps.plan.outputs.guest_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          SHA: ${{ inputs.sha }}
        run: |
          python3 scripts/release.py plan --bump "$BUMP" ${SHA:+--sha "$SHA"} > "$RUNNER_TEMP/plan"
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/plan"
          { echo "### Release plan"; echo; echo '```'; cat "$RUNNER_TEMP/plan"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  guest-build:
    name: guest-build (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.state == 'release' && needs.plan.outputs.guest_state == 'build'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      HASH: ${{ needs.plan.outputs.guest_hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Check out the release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - name: Build on the pinned guest base
        run: |
          described="$(python3 .release-tools/scripts/guest_release.py build-args)"
          mapfile -t args <<<"$described"
          docker build --provenance=false --sbom=false --pull "${args[@]}" -t else-guest:candidate infra/guest
      - name: Test keymap settling
        run: docker run --rm --user elsebot -v "$PWD/infra/guest:/guest:ro" --entrypoint python3 else-guest:candidate /guest/x11vnc/test_keymap_settle.py
      - name: Test VNC targets
        run: docker run --rm --user elsebot -v "$PWD/infra/guest:/guest:ro" --entrypoint python3 else-guest:candidate /guest/vnc/test_else_vnc_targets.py
      - name: Push
        env:
          ELSE_GUEST_REGISTRY_USER: ${{ github.actor }}
          ELSE_GUEST_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$ELSE_GUEST_REGISTRY_PASSWORD" | docker login ghcr.io -u "$ELSE_GUEST_REGISTRY_USER" --password-stdin
          ref="$IMAGE_REPO:src-$HASH-${{ matrix.arch }}"
          docker tag else-guest:candidate "$ref"
          docker push -q "$ref"
          python3 .release-tools/scripts/guest_release.py platform-digest "$ref" --platform linux/${{ matrix.arch }} > digest-${{ matrix.arch }}
          cat digest-${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}
          retention-days: 7

  guest-index:
    needs: [plan, guest-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      HASH: ${{ needs.plan.outputs.guest_hash }}
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Check out the release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
      - name: Publish the index
        id: image
        env:
          ELSE_GUEST_REGISTRY_USER: ${{ github.actor }}
          ELSE_GUEST_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$ELSE_GUEST_REGISTRY_PASSWORD" | docker login ghcr.io -u "$ELSE_GUEST_REGISTRY_USER" --password-stdin
          docker buildx imagetools create -t "$IMAGE_REPO:src-$HASH" \
            "$IMAGE_REPO@$(cat digest-amd64)" "$IMAGE_REPO@$(cat digest-arm64)"
          echo "image=$IMAGE_REPO@$(python3 .release-tools/scripts/guest_release.py digest "$IMAGE_REPO:src-$HASH")" >> "$GITHUB_OUTPUT"

  prepare:
    needs: [plan, guest-index]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.state == 'release' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.commit.outputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - name: Check out the release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - id: commit
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          IMAGE: ${{ needs.guest-index.outputs.image || needs.plan.outputs.guest_image }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .release-tools/scripts/release.py prepare --version "$VERSION" --image "$IMAGE" --push | tee -a "$GITHUB_OUTPUT"

  cargo-test:
    needs: [plan, prepare]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.state != '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/cargo-test.yml
    with:
      ref: ${{ needs.prepare.outputs.candidate || needs.plan.outputs.candidate }}

  release-ready:
    needs: [plan, prepare]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.state != '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-ready.yml
    with:
      ref: ${{ needs.prepare.outputs.candidate || needs.plan.outputs.candidate }}

  build:
    name: build (${{ matrix.platform }})
    needs: [plan, prepare]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.state != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
            container: debian:12
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            container: debian:12
            target: aarch64-unknown-linux-gnu
          - platform: macos-arm64
            runner: macos-15
            container: ''
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config git curl ca-certificates python3 libssl-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libx11-xcb-dev libx11-dev libfontconfig-dev libfreetype-dev libvulkan1 libzstd-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate || needs.plan.outputs.candidate }}
          persist-credentials: false
      - name: Check out the release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - name: Check the Metal compiler
        if: runner.os == 'macOS'
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version
      - name: Install stable Rust
        id: rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add '${{ matrix.target }}'
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Restore Cargo build cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/${{ matrix.target }}
          key: release-${{ matrix.platform }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.platform }}-${{ steps.rust.outputs.version }}-
      - name: Prepare email sign-in configuration
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import uuid
          from pathlib import Path

          value = os.environ.get("GOOGLE_OAUTH_CLIENT_JSON", "")
          if not value.strip():
              raise SystemExit("Set the GOOGLE_OAUTH_CLIENT_JSON repository secret before building a release.")
          microsoft = os.environ.get("MICROSOFT_CLIENT_ID", "")
          if not microsoft:
              raise SystemExit("Set the MICROSOFT_CLIENT_ID repository secret before building a release.")
          try:
              microsoft = str(uuid.UUID(microsoft))
          except ValueError:
              raise SystemExit("MICROSOFT_CLIENT_ID must be an application ID UUID.")
          path = Path(os.environ["RUNNER_TEMP"]) / "else-google-desktop.json"
          with open(path, "w", opener=lambda name, flags: os.open(name, flags, 0o600)) as config:
              config.write(value)
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"ELSE_GOOGLE_OAUTH_CONFIG={path}\n")
              environment.write(f"ELSE_MICROSOFT_CLIENT_ID={microsoft}\n")
          PY
      - name: Prepare GitHub MCP sign-in configuration
        env:
          ELSE_GITHUB_CLIENT_ID: ${{ secrets.ELSE_GITHUB_CLIENT_ID }}
          ELSE_GITHUB_CLIENT_SECRET: ${{ secrets.ELSE_GITHUB_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          registration = {}
          for field, name in (("client_id", "ELSE_GITHUB_CLIENT_ID"), ("client_secret", "ELSE_GITHUB_CLIENT_SECRET")):
              value = os.environ.get(name, "")
              if not value or len(value) > 2048 or any(not 0x21 <= ord(char) <= 0x7e for char in value):
                  raise SystemExit(f"Set a valid {name} repository secret before building a release.")
              registration[field] = value
          path = Path(os.environ["RUNNER_TEMP"]) / "else-github-oauth.json"
          with open(path, "w", opener=lambda name, flags: os.open(name, flags, 0o600)) as config:
              json.dump(registration, config)
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"ELSE_GITHUB_OAUTH_CONFIG={path}\n")
          PY
      - name: Build the desktop and API
        run: cargo build --release --locked --workspace --bins --target '${{ matrix.target }}'
      - name: Remove OAuth registrations
        if: always()
        run: rm -f "$RUNNER_TEMP/else-google-desktop.json" "$RUNNER_TEMP/else-github-oauth.json"
      - name: Save Cargo build cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/${{ matrix.target }}
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Check binary versions
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          for binary in else-api else-desktop; do
            actual="$("target/${{ matrix.target }}/release/$binary" --version)"
            test "$actual" = "$binary $version"
          done
      - name: Package binaries
        run: python3 .release-tools/scripts/release_binaries.py --platform '${{ matrix.platform }}' --binaries 'target/${{ matrix.target }}/release'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: target/release-assets/*.tar.gz
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 7

  publish:
    needs: [plan, prepare, build, cargo-test, release-ready]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.state != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate || needs.plan.outputs.candidate }}
          fetch-depth: 0
      - name: Check out the release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: target/release-assets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate || needs.plan.outputs.candidate }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .release-tools/scripts/release.py finalize --version "$VERSION" --rev "$CANDIDATE" --assets-dir target/release-assets
