[package]
name = "else-visual"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
else-wire = { workspace = true }
futures-channel = "0.3.34"
futures-executor = "0.3.34"
html5ever = "0.27.0"
markup5ever_rcdom = "0.3.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
takumi = { version = "=2.20.0", default-features = false, features = ["raster-backend", "from-html", "svg-source", "png", "jpeg", "webp", "woff2", "unstable"] }
thiserror = { workspace = true }
# The paint tree locates link boxes; pinned to the version `takumi` uses.
takumi-core = { version = "=0.36.0", default-features = false, features = ["paint-tree"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["param", "process", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
futures-executor = "0.3.34"

[lints]
workspace = true
