[package]
name = "else-visual"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
futures-channel = "0.3.34"
futures-executor = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
takumi = { version = "=2.20.0", default-features = false, features = ["raster-backend", "from-html", "svg-source", "png", "jpeg", "webp", "woff2", "unstable"] }
thiserror = "2.0.21"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["param", "process", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"

[dev-dependencies]
futures-executor = "0.3.34"

[lints]
workspace = true
