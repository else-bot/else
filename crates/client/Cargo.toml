[package]
name = "else-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[build-dependencies]
serde_json = { workspace = true }
uuid = { workspace = true }

[dependencies]
axum = { workspace = true, features = ["http1", "tokio", "query"] }
else-tailnet = { workspace = true }
else-wire = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock", "std"] }
futures-util = { workspace = true }
iana-time-zone = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "ico"] }
reqwest = { workspace = true, features = ["stream", "json", "rustls"] }
rustls = { workspace = true, features = ["aws-lc-rs", "std", "tls12"] }
rustls-platform-verifier = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
url = "2.5.8"
uuid = { workspace = true, features = ["v4", "serde"] }

[features]
# Test helpers for the apps' own tests.
testing = []

[dev-dependencies]
axum = { workspace = true, features = ["http1", "tokio", "json"] }
tokio = { workspace = true, features = ["io-util", "net"] }

[lints]
workspace = true
