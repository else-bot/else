services:
  # S3 emulator for the backup replication tests (POC-023). Synthetic keys
  # only; never a real bucket.
  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    # Small volumes, their count sized from free disk: every test bucket is
    # its own collection, and the default limit of 8 volumes fills up after
    # a few test runs ("Not enough data nodes found").
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-volume.max=0", "-master.volumeSizeLimitMB=64"]
    environment:
      AWS_ACCESS_KEY_ID: ${ELSE_TEST_S3_ACCESS_KEY_ID:?Set ELSE_TEST_S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${ELSE_TEST_S3_SECRET_ACCESS_KEY:?Set ELSE_TEST_S3_SECRET_ACCESS_KEY in .env}
    ports:
      - "127.0.0.1:${ELSE_TEST_S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  seaweedfs_data:
