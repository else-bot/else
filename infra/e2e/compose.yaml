# Disposable services for the native E2E lanes. The runner always supplies a
# unique project name. SQLite files belong to each disposable test/installation.
services:
  # Owns the network namespace and the kernel-assigned host port, so the
  # endpoint survives the outage tests stopping and restarting seaweedfs.
  s3:
    image: chrislusf/seaweedfs:4.50
    platform: linux/arm64
    entrypoint: ["sleep", "2147483647"]
    init: true
    ports:
      - "127.0.0.1::8333"
  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    platform: linux/arm64
    network_mode: service:s3
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-volume.max=0", "-master.volumeSizeLimitMB=64"]
    environment:
      AWS_ACCESS_KEY_ID: elsetestaccess01
      AWS_SECRET_ACCESS_KEY: elsetestsecret0123456789abcdef
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 250ms
      start_interval: 250ms
      timeout: 2s
      retries: 120
      start_period: 3s
    stop_grace_period: 1s
volumes:
  seaweedfs_data:
