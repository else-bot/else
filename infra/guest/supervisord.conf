[supervisord]
nodaemon=false
user=root
logfile=/var/log/elsebot/supervisord.log
pidfile=/run/elsebot/supervisord.pid

; The desktop starts on demand (else-desktop), not with the supervisor.
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24 -nolisten tcp
user=elsebot
priority=10
autorestart=true
autostart=false

[program:openbox]
command=/usr/bin/openbox
user=elsebot
environment=DISPLAY=":99",HOME="/home/elsebot"
priority=20
autorestart=true
autostart=false

[program:x11vnc]
; VNC requires the per-computer password; it listens inside the guest only.
; -nonap -wait 5 -defer 5 keep both servers polling and sending promptly. By
; default each slows its polling when its own viewers send no input, which the
; view-only server never receives, and the owner's takeover lags 100 ms or more.
command=/usr/bin/x11vnc -display :99 -passwdfile /etc/elsebot/vnc.pass -forever -shared -localhost -rfbport 5900 -noshm -quiet -nonap -wait 5 -defer 5 -gone "touch /var/lib/elsebot/vnc-released/$RFB_CLIENT_PORT"
user=elsebot
priority=30
autorestart=true
autostart=false

[program:x11vnc-watch]
; View-only VNC for the API's in-app viewer. else-input checks only 5900, so
; a viewer here never blocks the bot's input.
command=/usr/bin/x11vnc -display :99 -passwdfile /etc/elsebot/vnc.pass -forever -shared -localhost -rfbport 5901 -noshm -quiet -nonap -wait 5 -defer 5 -viewonly -desktop else-watch
user=elsebot
priority=35
autorestart=true
autostart=false

[program:novnc]
; noVNC over WebSocket, published by the runtime to host loopback only. The
; Host name picks the VNC server, and a controlling connection takes the
; browser lock (see else_vnc_targets.py). It runs as the desktop user, who
; owns that lock file.
command=/usr/bin/websockify --web /usr/share/novnc --token-plugin else_vnc_targets.Targets --host-token 6080
user=elsebot
environment=PYTHONPATH="/usr/local/lib/elsebot/vnc",HOME="/home/elsebot"
priority=40
autorestart=true
autostart=false

[program:chromium]
; DevTools listens on guest loopback only; the profile persists on disk.
command=/usr/bin/chromium --user-data-dir=/home/elsebot/.config/chromium --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 --no-first-run --no-default-browser-check --disable-dev-shm-usage --window-size=1280,800 about:blank
user=elsebot
environment=DISPLAY=":99",HOME="/home/elsebot"
priority=50
autorestart=true
autostart=false
; SIGINT closes Chromium gracefully and commits its cookie store; SIGTERM
; exits at once and loses cookies set in the last 30 seconds.
stopsignal=INT
stopwaitsecs=10

[unix_http_server]
; The desktop user manages the desktop programs (else-desktop starts them)
; through this socket; they all run as that user.
file=/run/elsebot/supervisor.sock
chmod=0770
chown=root:elsebot

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/elsebot/supervisor.sock
