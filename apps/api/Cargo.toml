[package]
name = "else-api"
version = "0.1.0"
edition = "2024"

[dependencies]
age = { version = "=0.12.1", default-features = false }
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros", "ws"] }
base64 = "0.23.1"
bech32 = "=0.9.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
getrandom = "0.4.3"
hkdf = "=0.12.4"
hex = "0.4.3"
hmac = "=0.12.1"
zeroize = "1.8.2"
libc = "0.2.191"
# S3 replication (POC-023): a small SigV4 client over HTTPS.
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# HKDF 0.12 is built on the RustCrypto digest 0.10 traits.
sha2_010 = { package = "sha2", version = "=0.10.9" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros", "json"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync", "process", "io-util", "fs"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower-http = { version = "0.7.1", features = ["limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
async-trait = "0.1.92"
dotenvy = "0.15.7"
futures-util = "0.3.34"
http-body-util = "0.1.5"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json"] }
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
tokio-util = "0.7.20"
tower = { version = "0.5.3", features = ["util"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
