[package]
name = "else-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[build-dependencies]
serde_json = { workspace = true }

[dependencies]
else-tailnet = { workspace = true }
else-visual = { workspace = true }
age = { version = "=0.12.1", default-features = false }
anyhow = { workspace = true }
async-trait = "0.1.92"
axum = { workspace = true, features = ["default", "macros", "ws"] }
base64 = { workspace = true }
bech32 = "=0.9.1"
chrono = { workspace = true, features = ["serde", "clock", "std"] }
chrono-tz = { workspace = true }
clap = { version = "4.6.7", features = ["derive"] }
croner = { workspace = true }
des = "0.8.1"
dotenvy = { workspace = true }
fastcdc = "=5.0.0"
flate2 = "1.1.10"
futures-util = { workspace = true }
getrandom = "0.4.3"
hkdf = "=0.12.4"
hex = "0.4.3"
hmac = "=0.12.1"
iana-time-zone = { workspace = true }
io-imap = { version = "=0.8.1", default-features = false, features = ["client"] }
io-smtp = { version = "=0.7.1", default-features = false, features = ["client"] }
io-sasl = { version = "=0.1.1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = { workspace = true }
mail-parser = "0.11.3"
mail-builder = "0.4.4"
zeroize = "1.8.2"
libc = { workspace = true }
rustix = { workspace = true, features = ["fs", "process", "event", "param", "std"] }
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
markdown = { workspace = true }
mime_guess = { workspace = true }
quick-xml = { version = "0.41.0", features = ["serialize"] }
percent-encoding = "2.3.2"
png = "0.18.1"
reqwest = { workspace = true, features = ["stream", "json", "rustls", "form"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest", "reqwest"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
# HKDF 0.12 is built on the RustCrypto digest 0.10 traits.
sha2_010 = { package = "sha2", version = "=0.10.9" }
similar = { version = "2.7.0", default-features = false }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "sqlite-deserialize", "uuid", "chrono", "migrate", "macros", "json"] }
strum = { version = "0.28.0", features = ["derive"] }
subtle = "2.6.1"
tar = { version = "0.4.46", default-features = false }
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync", "process", "io-util", "fs"] }
tokio-util = { version = "0.7.20", features = ["codec", "rt"] }
tokio-tungstenite = { workspace = true }
tempfile = { workspace = true }
teloxide-core = { version = "0.13.0", default-features = false, features = ["rustls", "throttle"] }
twilight-http = "0.18.0"
twilight-gateway = "0.18.0"
twilight-model = "0.18.0"
twilight-util = { version = "0.18.0", features = ["permission-calculator"] }
tower-http = { version = "0.7.1", features = ["limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { workspace = true, features = ["v4", "serde"] }
zstd = { version = "0.13.3", default-features = false, features = ["zstdmt"] }

[dev-dependencies]
age = { version = "=0.12.1", default-features = false }
tokio = { workspace = true, features = ["test-util"] }
rcgen = "0.14"
async-trait = "0.1.92"
dotenvy = { workspace = true }
futures-util = { workspace = true }
http-body-util = "0.1.5"
reqwest = { workspace = true, features = ["stream", "json"] }
tokio-tungstenite = { workspace = true }
tokio-util = "0.7.20"
tower = { version = "0.5.3", features = ["util"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zstd = { version = "0.13.3", default-features = false }

[lints]
workspace = true
