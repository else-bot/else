[package]
name = "else-mobile"
version = "0.0.30"
edition = "2024"
publish = false

# NSH builds its own runners around this crate, so it stays out of the root
# workspace and keeps its own lockfile.
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
else-wire = { path = "../../crates/wire" }
nsh-core = "0.6.1"
nsh-base = "0.6.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = "0.3.34"
log = "0.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "sync", "macros", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
libc = "0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
env_logger = "0.11"
nsh-platform-macos = { version = "0.6.1", default-features = false, features = ["svg"] }
