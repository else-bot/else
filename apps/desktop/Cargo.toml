[package]
name = "else-desktop"
version.workspace = true
edition.workspace = true

[build-dependencies]
serde_json = "1.0.154"
uuid = "1.29.0"

[dependencies]
else-tailnet = { path = "../../crates/tailnet" }
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
futures-util = "0.3.34"
gpui-kit = "=0.9.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
libc = "0.2.191"
markdown = "1.0.0"
rand = "0.10.3"
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json", "rustls"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "sync", "macros", "process", "fs", "io-util", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify = "8.2.1"
toml = "0.8.23"
wl-clipboard-rs = "0.9.5"

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json"] }
futures-util = "0.3.34"
proc-macro2 = "1.0.107"
tokio = { version = "1.54.1", features = ["io-util", "net"] }
