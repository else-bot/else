[package]
name = "else-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
futures-util = "0.3.34"
gpui-kit = "=0.8.1"
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json"] }
rustls.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tokio-tungstenite = "0.30.0"
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
futures-util = "0.3.34"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "net"] }
