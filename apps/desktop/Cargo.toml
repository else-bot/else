[package]
name = "else-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[build-dependencies]
serde_json = { workspace = true }
uuid = { workspace = true }

[dependencies]
else-tailnet = { workspace = true }
else-visual = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio"] }
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock", "std"] }
bytesize = "2.7.0"
chrono-tz = { workspace = true }
croner = { workspace = true }
dotenvy = { workspace = true }
futures-util = { workspace = true }
gpui-kit = { version = "=0.9.0", features = ["syntect"] }
iana-time-zone = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "ico"] }
libc = { workspace = true }
rustix = { workspace = true, features = ["event", "process", "std"] }
markdown = { workspace = true }
rand = "0.10.3"
mime_guess = { workspace = true }
reqwest = { workspace = true, features = ["stream", "json", "rustls"] }
rustls = { workspace = true, features = ["aws-lc-rs", "std", "tls12"] }
rustls-platform-verifier = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros", "process", "fs", "io-util", "net"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
url = "2.5.8"
uuid = { workspace = true, features = ["v4", "serde"] }
vte = "0.14.1"
xkeysym = "0.2.1"

[target.'cfg(target_os = "linux")'.dependencies]
notify = "8.2.1"
toml = { workspace = true }
wl-clipboard-rs = "0.9.5"

[dev-dependencies]
axum = { workspace = true, features = ["json"] }
futures-util = { workspace = true }
proc-macro2 = "1.0.107"
sha2 = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net"] }

[lints]
workspace = true
