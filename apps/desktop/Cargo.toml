[package]
name = "else-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
gpui-kit = "=0.8.1"
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "sync", "macros"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "net"] }
