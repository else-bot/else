[workspace]
members = ["apps/api", "apps/desktop", "crates/tailnet", "crates/visual"]
resolver = "3"

[workspace.package]
version = "0.0.57"
edition = "2024"
rust-version = "1.100"

[workspace.dependencies]
else-tailnet = { path = "crates/tailnet" }
else-visual = { path = "crates/visual" }
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false }
chrono-tz = "0.10.4"
croner = "4.0.2"
dotenvy = "0.15.7"
futures-util = "0.3.34"
iana-time-zone = "0.1.65"
image = { version = "0.25.10", default-features = false }
libc = "0.2.191"
markdown = "1.0.0"
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", default-features = false }
rustix = "1.1.6"
rustls = { version = "0.23.46", default-features = false }
rustls-platform-verifier = "0.7.1"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-tungstenite = "0.30.0"
toml = "1.1.8"
uuid = "1.29.0"

[workspace.lints.cargo]
unused_dependencies = "warn"

[profile.dev]
debug = 0

# Native link previews, pinned until the hook lands upstream.
[patch.crates-io]
gpui-base = { git = "https://github.com/else-bot/gpui-kit", rev = "f4403dce5487a5635f23f4175bbcd2acdefe787d" }
