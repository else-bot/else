[workspace]
members = ["apps/api", "apps/desktop"]
exclude = ["docs/experiments/backups"]
resolver = "3"

# The one else.bot version: both binaries report it, release tags are
# v<version>, and scripts/release.sh bumps it.
[workspace.package]
version = "0.0.5"
edition = "2024"

# Local installs manage hundreds of bots, with provider work in external
# processes. Prefer a quick first build over maximum LLVM optimization.
[profile.release]
opt-level = 1
codegen-units = 256
# `false` still enables thin local LTO; `"off"` skips that work too.
lto = "off"

# Keep file/line backtraces without generating full variable/type debug info
# for the desktop's large dependency graph. Use CARGO_PROFILE_DEV_DEBUG=2 for
# full debugger support.
[profile.dev]
debug = "line-tables-only"
