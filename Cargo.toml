[workspace]
members = ["apps/api", "apps/desktop"]
exclude = ["docs/experiments/backups"]
resolver = "3"

# The one else.bot version: both binaries report it, release tags are
# v<version>, and scripts/release.sh bumps it.
[workspace.package]
version = "0.0.8"
edition = "2024"

# Prefer fast checkout builds over generating debug information for GPUI's
# large dependency graph. Use CARGO_PROFILE_DEV_DEBUG=2 for full debugging.
[profile.dev]
debug = 0

# Markdown wrapping and link previews, pinned until these fixes land upstream.
[patch.crates-io]
gpui-base = { git = "https://github.com/else-bot/gpui-kit", rev = "35e493484fcab19a5a7fd8184fb207b6b18beb20" }
