[workspace]
members = ["apps/api", "apps/desktop"]
exclude = ["docs/experiments/backups"]
resolver = "3"

# The one else.bot version: both binaries report it, release tags are
# v<version>, and scripts/release.sh bumps it.
[workspace.package]
version = "0.0.5"
edition = "2024"

[workspace.dependencies]
# ring avoids AWS-LC's large native build; choose the provider explicitly in
# each process before constructing reqwest clients.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

# Keep file/line backtraces without generating full variable/type debug info
# for the desktop's large dependency graph. Use CARGO_PROFILE_DEV_DEBUG=2 for
# full debugger support.
[profile.dev]
debug = "line-tables-only"
